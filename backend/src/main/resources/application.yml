spring:
  application:
    name: locus
  config:
    # Local development: values from backend/.env (git-ignored) are loaded if the file exists.
    # Real environment variables still take precedence.
    import: optional:file:.env[.properties]
  datasource:
    # Neon connection, e.g. jdbc:postgresql://<host>.neon.tech/neondb?sslmode=require
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks it matches.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml

locus:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  jwt:
    secret: ${JWT_SECRET}
    issuer: locus-api
    expiration-seconds: 3600
  stripe:
    # Test-mode secret key (sk_test_...). Left empty, the payment worker stays off.
    secret-key: ${STRIPE_SECRET_KEY:}
  payments:
    # How often the worker looks for payments to send, and how many tries before giving up.
    poll-interval-ms: 5000
    max-attempts: 5
  geocoding:
    # Free OpenStreetMap address search (no key). Its usage policy: max 1 request
    # per second, a User-Agent naming the app, and no bulk geocoding.
    url: https://nominatim.openstreetmap.org
    user-agent: Locus-SOEN387-student-project
  rate-limit:
    enabled: true
    capacity: 120          # IP backstop per client address
    refill-tokens: 120
    refill-period: PT1M
    user:
      capacity: 60         # per logged-in user
      refill-period: PT1M
    expensive:
      capacity: 10         # per logged-in user, for Gemini and event lookups
      refill-period: PT1M
